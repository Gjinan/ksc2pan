# EDL 端点：给 Palo Alto 拉取纯文本清单
# 要点：
#   1. 不要开 Basic Auth —— PAN-OS 在认证失败时会"停止执行整条 EDL"（fail-open），
#      内网环境用 IP ACL 限制来源更安全；
#   2. 不要缓存，每次拉到的必须是最新文件；
#   3. 只暴露 4 个固定文件，其他路径一律 403。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 只允许防火墙管理口访问（按现场改成 PA 的管理 IP / HA 对）
    # allow 10.0.0.1;
    # allow 10.0.0.2;
    # deny  all;

    autoindex off;
    server_tokens off;
    charset utf-8;

    location ~ ^/(ip-block|watch|domain-sink|whitelist)\.txt$ {
        default_type text/plain;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 403;
    }
}
