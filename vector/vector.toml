# Vector：接收 KSC 的 Syslog(RFC5424)，做粗筛与字段提取，转发给 ksc2pan。
#
# 分工：
#   · Vector 负责：TLS 终止、批量、磁盘缓冲、按事件码粗筛（把 90% 噪音挡在服务之外）；
#   · ksc2pan 负责：权威解析（Python 侧有单测）、白名单、分级、下发。
# 所以本文件里的正则只用于"提取几个通用字段"，不作为唯一依据——
# 即使这里取错，服务端仍会从 raw 重新解析。

[sources.ksc_syslog]
type = "syslog"
mode = "tcp"
address = "0.0.0.0:6514"
# 需要 TLS 时启用（把证书挂进容器）：
# tls.enabled = true
# tls.crt_file = "/etc/vector/certs/server.crt"
# tls.key_file = "/etc/vector/certs/server.key"
# tls.ca_file  = "/etc/vector/certs/ca.crt"
decoding.codec = "bytes"

[transforms.ksc_parse]
type = "remap"
inputs = ["ksc_syslog"]
drop_on_error = false
source = '''
  # 全部用非 "!" 版本 + 兜底，保证解析失败时事件仍能落到 deadletter，而不是被丢弃
  parsed = parse_syslog(.message) ?? {}
  .raw  = .message
  .app  = to_string(parsed.appname) ?? ""
  .host = to_string(parsed.hostname) ?? ""
  .ts   = to_float(to_unix_timestamp(parsed.timestamp, unit: "seconds")) ?? 0.0

  m  = parse_regex(.raw, r'\[event@\d+\s+(?P<kv>.*?)\](?P<body>.*)$') ?? {}
  kv = parse_key_value(to_string(m.kv) ?? "", key_value_delimiter: "=", field_delimiter: " ") ?? {}
  .event_type = to_string(kv.et) ?? ""
  .agent_ip   = to_string(kv.hip) ?? ""
  .host       = if .host == "" { to_string(kv.hdn) ?? "" } else { .host }
  .body       = to_string(m.body) ?? ""

  # 只放行网络威胁类事件（事件码与 ksc2pan/ksc_parser.py 保持一致）
  network = ["GNRL_EV_ATTACK_DETECTED", "000007d1", "00000329", "00000abe"]
  web     = ["GNRL_EV_WEB_URL_BLOCKED", "GNRL_EV_WEB_URL_BLOCKED_BY_KSN"]
  .keep_network = includes(network, .event_type) || includes(web, .event_type)

  # 只在正文里找 IPv4 用于日志可读性；权威判定在服务端
  hits = parse_regex_all(.body, r'(?P<ip>\b(?:\d{1,3}\.){3}\d{1,3}\b)') ?? []
  .ips = map(hits) -> |_i, v| { v.ip }
'''

# 解析失败（事件码都没取到）= 格式漂移，必须进死信队列，不能静默丢
[transforms.ksc_parse_failed]
type = "filter"
inputs = ["ksc_parse"]
condition = '.event_type == ""'

# 非网络类事件：正常噪音，直接丢弃（但仍计数，便于评估导出范围是否过宽）
[transforms.ksc_not_relevant]
type = "filter"
inputs = ["ksc_parse"]
condition = '.event_type != "" && .keep_network != true'

[transforms.ksc_keep]
type = "filter"
inputs = ["ksc_parse"]
condition = '.keep_network == true'

[sinks.to_ksc2pan]
type = "http"
inputs = ["ksc_keep"]
uri = "http://ksc2pan:8080/ingest"
method = "post"
encoding.codec = "json"
framing.method = "newline_delimited"
batch.max_events = 200
batch.timeout_secs = 2
request.timeout_secs = 10
request.retry_max_duration_secs = 3600
buffer.type = "disk"
buffer.max_size = 1073741824
healthcheck.enabled = true

[sinks.deadletter]
type = "http"
inputs = ["ksc_parse_failed"]
uri = "http://ksc2pan:8080/deadletter"
method = "post"
encoding.codec = "json"
framing.method = "newline_delimited"
batch.max_events = 200
buffer.type = "disk"
buffer.max_size = 268435456

[sinks.noise]
type = "blackhole"
inputs = ["ksc_not_relevant"]
