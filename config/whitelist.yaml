# 白名单（建议放 Git，走 PR + 双人审批）
#
# 现场真实网段建议写到同目录的 whitelist.local.yaml（已在 .gitignore 中排除），
# 服务启动时会把它追加到本文件之后，两处条目适用同一套校验规则。
#
# 规则：
#   · L0 内置保留段（10/8、172.16/12、192.168/16、127/8、100.64/10 …）在代码里，不在此文件，
#     也不可被删除或覆盖；
#   · assets 每条必须有 why，建议带 owner / ticket；
#   · temporary 每条必须有 expire，到期自动失效；
#   · 单个网段不允许比 /8（IPv4）或 /16（IPv6）更宽，写错会被拒绝加载。
version: "2026.11"

